<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDN Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f6fa;height:100vh;display:flex;align-items:center;justify-content:center}
.card{border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);width:380px}
.card-header{text-align:center;font-weight:700;font-size:20px;padding:20px}
.alert{margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">CDN Manager</div>
  <div class="card-body">
    <form method="post" action="/cdn-gui/login">
      <div class="mb-3"><input class="form-control" name="username" placeholder="用户名" required autofocus></div>
      <div class="mb-3"><input class="form-control" type="password" name="password" placeholder="密码" required></div>
      <button class="btn btn-primary w-100" type="submit">登录</button>
    </form>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
  </div>
</div>
</body>
</html>
